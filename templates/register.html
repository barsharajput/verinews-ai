<!doctype html>

<html lang="en" class="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Register | VeriNews AI</title>

        <script src="https://cdn.tailwindcss.com"></script>

        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
            rel="stylesheet"
        />

        <style>
            body {
                font-family: "Inter", sans-serif;
                background: linear-gradient(135deg, #020617, #0f172a);
            }
            .card {
                background: rgba(255, 255, 255, 0.05);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
        </style>
    </head>

    <body class="flex items-center justify-center min-h-screen">
        <div
            class="grid md:grid-cols-2 max-w-5xl w-full rounded-xl overflow-hidden shadow-2xl"
        >
            <!-- LEFT SIDE -->

            <div
                class="hidden md:flex flex-col justify-center p-10 bg-gradient-to-br from-green-500/20 to-transparent"
            >
                <h1 class="text-4xl font-bold mb-4 text-white">
                    Join <span class="text-green-400">VeriNews AI 🚀</span>
                </h1>
                <p class="text-gray-400">
                    Create your account and start detecting fake news with AI.
                </p>
            </div>

            <!-- RIGHT SIDE -->

            <div class="card p-10">
                <h2 class="text-2xl font-bold mb-6 text-center text-white">
                    Create Account
                </h2>

                <form method="POST" class="space-y-4">
                    {% if error %}
                    <p class="text-red-400 text-sm text-center">{{ error }}</p>
                    {% endif %}

                    <!-- NAME -->
                    <div class="flex gap-3">
                        <input
                            type="text"
                            name="first_name"
                            placeholder="First Name"
                            required
                            class="w-full p-3 rounded bg-gray-800 border border-gray-700 text-white placeholder-gray-400 focus:ring-2 focus:ring-green-500"
                        />

                        <input
                            type="text"
                            name="last_name"
                            placeholder="Last Name"
                            required
                            class="w-full p-3 rounded bg-gray-800 border border-gray-700 text-white placeholder-gray-400 focus:ring-2 focus:ring-green-500"
                        />
                    </div>

                    <!-- EMAIL -->
                    <input
                        type="email"
                        name="email"
                        placeholder="Email"
                        required
                        class="w-full p-3 rounded bg-gray-800 border border-gray-700 text-white placeholder-gray-400 focus:ring-2 focus:ring-green-500"
                    />

                    <!-- USERNAME -->
                    <input
                        type="text"
                        name="username"
                        placeholder="Username"
                        required
                        class="w-full p-3 rounded bg-gray-800 border border-gray-700 text-white placeholder-gray-400 focus:ring-2 focus:ring-green-500"
                    />

                    <!-- PASSWORD -->
                    <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        required
                        class="w-full p-3 rounded bg-gray-800 border border-gray-700 text-white placeholder-gray-400 focus:ring-2 focus:ring-green-500"
                    />

                    <!-- COUNTRY + PHONE -->
                    <div class="flex gap-3">
                        <input
                            type="text"
                            name="country"
                            placeholder="Country"
                            class="w-full p-3 rounded bg-gray-800 border border-gray-700 text-white placeholder-gray-400 focus:ring-2 focus:ring-green-500"
                        />

                        <input
                            type="text"
                            name="phone"
                            placeholder="Phone Number"
                            class="w-full p-3 rounded bg-gray-800 border border-gray-700 text-white placeholder-gray-400 focus:ring-2 focus:ring-green-500"
                        />
                    </div>

                    <!-- BUTTON -->
                    <button
                        type="submit"
                        class="w-full bg-green-500 text-black py-3 rounded font-semibold hover:bg-green-400 transition"
                    >
                        🚀 Sign Up
                    </button>
                </form>

                <p class="text-center text-gray-400 mt-6">
                    Already have an account?
                    <a href="{{ url_for('login') }}" class="text-green-400"
                        >Login</a
                    >
                </p>
            </div>
        </div>
    </body>
</html>
